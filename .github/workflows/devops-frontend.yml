name: "DevOps: Frontend"
# Builds the React/Vite SPA (via the root npm-workspaces build, which compiles
# @monopoly-arena/engine before @monopoly-arena/web) and deploys to S3 + CloudFront.
#
# Auth: GitHub OIDC → assumes the {app}-ci role. No AWS keys in Secrets.
#
# Required GitHub Variables:
#   AWS_ACCOUNT_ID, TF_VAR_APP_NAME (set by bootstrap.ps1)
#   S3_BUCKET, CLOUDFRONT_DIST_ID (auto-set by devops-infra.yml)

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/web/**'
      - 'packages/engine/**'
  workflow_dispatch:

concurrency:
  group: devops-frontend
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-west-2

permissions:
  id-token: write   # OIDC token for AWS role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.TF_VAR_APP_NAME }}-ci
          aws-region: us-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: npm install && npm run build

      # Sync Vite-hashed assets first — 1-year immutable cache, no --delete
      # (old hashed filenames safe to keep; may still be referenced by cached pages)
      - name: Sync assets to S3
        run: |
          aws s3 sync packages/web/dist/assets/ \
            s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public,max-age=31536000,immutable"

      # Sync everything else (HTML, icons, manifest) — no-cache, delete stale files
      - name: Sync HTML and root files to S3
        run: |
          aws s3 sync packages/web/dist/ \
            s3://${{ vars.S3_BUCKET }}/ \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache"

      # Only index.html needs invalidation — hashed assets never need it
      - name: Invalidate CloudFront index
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html"
